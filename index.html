function parseD(s){return new Date(s+"T00:00:00");}
function dayDiff(a,b){return Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);}
function fmtShort(d){return`${d.getDate()} ${MONTHS_S[d.getMonth()]}`;}
// Phases d'un cycle de longueur len avec des règles de pl jours (ovulation ~14 j avant les règles suivantes)
function phaseRanges(len,pl){const ov=Math.max(pl+1,len-17);return{ovStart:ov,ovEnd:ov+2};}
function getPhaseForInfo(info){
  if(info.day<=info.pl)return PHASES[0];
  const{ovStart,ovEnd}=phaseRanges(info.len,info.pl);
  if(info.day<ovStart)return PHASES[1];
  if(info.day<=ovEnd)return PHASES[2];
  return PHASES[3];
}
function phaseDaysLabel(key,len,pl){
  const{ovStart,ovEnd}=phaseRanges(len,pl);
  const r={menstruelle:[1,pl],folliculaire:[pl+1,ovStart-1],ovulation:[ovStart,ovEnd],luteale:[ovEnd+1,len]}[key];
  return`Jour ${r[0]} à ${r[1]}`;
}
// Construit le modèle du cycle à partir des règles enregistrées [{start:"YYYY-MM-DD",end:"YYYY-MM-DD"|null}]
function buildCycle(periods){
  const today=parseD(dStr(TODAY));
  const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  let ps=periods.filter(p=>p&&p.start).slice().sort((a,b)=>a.start.localeCompare(b.start));
  if(!ps.length){
    const k=Math.max(0,Math.floor(dayDiff(today,CYCLE_START)/CYCLE_LEN));
    ps=[{start:dStr(addDays(CYCLE_START,k*CYCLE_LEN)),end:null}];
  }
  const starts=ps.map(p=>parseD(p.start));
  const gaps=[];
  for(let i=1;i<starts.length;i++){const g=dayDiff(starts[i],starts[i-1]);if(g>=18&&g<=60)gaps.push(g);}
  const cycleLen=gaps.length?Math.round(avg(gaps.slice(-6))):CYCLE_LEN;
  const durs=ps.filter(p=>p.end).map(p=>dayDiff(parseD(p.end),parseD(p.start))+1).filter(d=>d>=1&&d<=15);
  const periodLen=durs.length?Math.round(avg(durs.slice(-6))):PERIOD_LEN;
  const durOf=p=>p.end?Math.max(1,dayDiff(parseD(p.end),parseD(p.start))+1):periodLen;
  const n=ps.length,last=ps[n-1],lastStart=starts[n-1];
  const predictedNext=addDays(lastStart,cycleLen);
  const late=Math.max(0,dayDiff(today,predictedNext));
  // Début des cycles projetés : la date prévue, ou demain si les règles sont en retard
  const base=late>0?addDays(today,1):predictedNext;

  const infoFor=date=>{
    let i=-1;
    for(let k=n-1;k>=0;k--)if(dayDiff(date,starts[k])>=0){i=k;break;}
    if(i===-1){
      const x=dayDiff(date,starts[0]);
      return{day:((x%cycleLen)+cycleLen)%cycleLen+1,len:cycleLen,pl:periodLen,predicted:true};
    }
    if(i<n-1)return{day:dayDiff(date,starts[i])+1,len:dayDiff(starts[i+1],starts[i]),pl:durOf(ps[i]),predicted:false};
    if(dayDiff(date,base)<0)return{day:dayDiff(date,lastStart)+1,len:Math.max(cycleLen,dayDiff(base,lastStart)),pl:durOf(last),predicted:!last.end&&dayDiff(date,today)>0};
    return{day:dayDiff(date,base)%cycleLen+1,len:cycleLen,pl:periodLen,predicted:true};
  };
  const phaseFor=date=>getPhaseForInfo(infoFor(date));
  const todayInfo=infoFor(today);
  const inPeriod=todayInfo.day<=todayInfo.pl;
  const upcoming=[0,1,2].map(k=>{const s=addDays(base,k*cycleLen);return{start:s,end:addDays(s,periodLen-1)};});
  return{
    periods:ps,cycleLen,periodLen,infoFor,phaseFor,
    today:todayInfo,phase:getPhaseForInfo(todayInfo),inPeriod,late:inPeriod?0:late,
    daysLeft:Math.max(0,dayDiff(base,today)),
    openPeriod:!last.end&&dayDiff(today,lastStart)>=0&&dayDiff(today,lastStart)<15?last:null,
    upcoming,
  };
}
function dStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function getMonDay(d){const day=d.getDay();return day===0?6:day-1;}
function getDIM(y,m){return new Date(y,m+1,0).getDate();}
function getFirstMon(y,m){const d=new Date(y,m,1).getDay();return d===0?6:d-1;}

const ICON_CHOICES=["droplet","glass","moon","bed","lotus","book","heart","shoe","dumbbell","cup","bowl","apple","sun","leaf","flower","sparkles","star","briefcase","music","pill","flame","calendar","check","home"];
const EMOJI_ICON={"💧":"droplet","🌙":"moon","🧘":"lotus","📖":"book","📚":"book","❤":"heart","💖":"heart","💕":"heart","👟":"shoe","🏃":"shoe","🚶":"shoe","🧋":"cup","☕":"cup","🍵":"cup","💪":"dumbbell","🏋":"dumbbell","🥪":"bowl","🥗":"bowl","🍳":"bowl","🍎":"apple","⭐":"star","🌟":"star","✨":"sparkles","🔥":"flame","🌸":"flower","🌷":"flower","☀":"sun","🌿":"leaf","🍃":"leaf","🌱":"leaf","💼":"briefcase","🎵":"music","🎶":"music","😴":"bed","🛏":"bed","💊":"pill","📅":"calendar","🗓":"calendar","✅":"check"};
// Accepte un nom d'icône ou un ancien emoji enregistré
function toIconName(v){
  if(!v)return"star";
  if(ICON_CHOICES.includes(v))return v;
  return EMOJI_ICON[v.replace(/[\uFE0F\u200D\u2640\u2642\u{1F3FB}-\u{1F3FF}]/gu,"")]||null;
}
function HabIcon({v,size=18}){const n=toIconName(v);return n?<Icon name={n} size={size}/>:<span>{v}</span>;}
function IconPicker({value,onChange}){
  const cur=toIconName(value);
  return(<div className="ipick">{ICON_CHOICES.map(n=><div key={n} className={`ipick-item${cur===n?" sel":""}`} onClick={()=>onChange(n)}><Icon name={n} size={18}/></div>)}</div>);
}

              <div className="symp-title">Phase {displayPhase.label}</div>
              <div className="symp-sub">{phaseDaysLabel(displayPhase.key,cycle.cycleLen,cycle.periodLen)} — Symptômes fréquents</div>
              <div className="symp-tags">{displayPhase.symptoms.map(s=><div key={s} className="symp-tag" style={{background:displayPhase.light,color:displayPhase.color}}>{s}</div>)}</div>
            </div>
            <div className="symp-box">
              <div className="symp-title"><Icon name="dumbbell" size={16}/> Sport recommandé</div>
              <div className="symp-sub">{getSportForPhase(displayPhase.key).title}</div>
              <div style={{fontSize:12,color:DARK,fontWeight:300,lineHeight:1.6}}>{getSportForPhase(displayPhase.key).tip}</div>
            </div>
            <div className="cycle-cal-title">Calendrier du cycle</div>
            <div className="mnav" style={{marginBottom:7}}>
              <button className="arr" onClick={()=>setCalMonth(c=>c.m===0?{y:c.y-1,m:11}:{...c,m:c.m-1})}>‹</button>
              <div className="mtitle" style={{fontSize:15}}>{MONTHS_FR[calMonth.m]} <small>{calMonth.y}</small></div>
              <button className="arr" onClick={()=>setCalMonth(c=>c.m===11?{y:c.y+1,m:0}:{...c,m:c.m+1})}>›</button>
            </div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:9}}>
              {PHASES.map(ph=><div key={ph.key} style={{display:"flex",alignItems:"center",gap:3,fontSize:9,color:"#888"}}><div style={{width:8,height:8,borderRadius:"50%",background:ph.color}}/>{ph.label}</div>)}
            </div>
            <div className="wlabels">{DAYS_FR.map(d=><div key={d} className="wlabel">{d}</div>)}</div>
            <div className="cycle-cgrid" style={{marginBottom:6}}>{mkCycleGrid()}</div>
            <div style={{display:"flex",gap:12,fontSize:9,color:"#888",marginBottom:16}}>
              <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:10,height:10,borderRadius:"50%",background:PHASES[0].color}}/>Règles enregistrées</span>
              <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:10,height:10,borderRadius:"50%",border:`1.5px dashed ${PHASES[0].color}`}}/>Règles prévues</span>
            </div>
            <div className="symp-box">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div className="symp-title"><Icon name="history" size={16}/> Historique de mes règles</div>
                <button className="copy-btn" onClick={()=>{setCycleForm({start:todayStr,end:""});setCycleModal({mode:"add"});}}><Icon name="plus" size={12}/> Ajouter</button>
              </div>
              <div className="symp-sub">Touche une ligne pour la modifier</div>
              {periods.length===0&&<div style={{fontSize:11,color:"#aaa"}}>Aucune règle enregistrée pour l'instant.</div>}
              {[...periods].sort((a,b)=>b.start.localeCompare(a.start)).map((p,i,arr)=>{
                const s=parseD(p.start),dur=p.end?dayDiff(parseD(p.end),s)+1:null;
                const next=i>0?parseD(arr[i-1].start):null;
                return(
                  <div key={p.start} onClick={()=>openPeriodEdit(p)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderTop:i?`1px solid ${BLUSH}`:"none",cursor:"pointer",fontSize:12,color:DARK}}>
                    <span>{fmtShort(s)} {s.getFullYear()!==TODAY.getFullYear()?s.getFullYear():""} → {p.end?fmtShort(parseD(p.end)):<i style={{color:"#aaa"}}>en cours</i>}</span>
                    <span style={{fontSize:10,color:"#aaa",textAlign:"right"}}>{dur?`${dur} j de règles`:""}{next?`${dur?" · ":""}cycle ${dayDiff(next,s)} j`:""}</span>
                  </div>
                );
              })}
            </div>
            <div className="partner-box">
              <div className="partner-title"><Icon name="heart" size={17}/> Partager avec mon partenaire</div>
              <div className="partner-sub">Donne ce code à Tom pour qu'il puisse suivre ton cycle.</div>
              <div className="partner-code-box">
                <div className="partner-code">{MY_CODE}</div>
                <button className="copy-btn" onClick={copyCode}>{copied?<>Copié <Icon name="tick" size={11} strokeWidth={2.6}/></>:"Copier"}</button>
              </div>
              <div className="partner-hint">Tom entre ce code dans sa section Cycle <Icon name="mail" size={11} style={{verticalAlign:"-1.5px"}}/></div>
              <div className="partner-divider">— ou —</div>
              <div style={{fontSize:11,color:"#aaa",marginBottom:7}}>Entrer le code de quelqu'un d'autre</div>
              {partnerView?(
                <div>
                  <div className="pview-hero" style={{background:`linear-gradient(135deg,${partnerView.phase.color},${partnerView.phase.color}bb)`}}>
                    <div className="pview-label">Règles dans</div>
                    <div className="pview-days">{partnerView.days} jours</div>
                    <div className="pview-phase"><Icon name={PHASE_ICON_NAME[partnerView.phase.key]} size={12}/> Phase {partnerView.phase.label}</div>
                  </div>
                  <div className="pview-name">Connecté à {partnerView.name}</div>
                  <button className="disconnect-btn" onClick={()=>{setPartnerView(null);setPartnerCode("");}}>Se déconnecter</button>
                </div>
              ):(
                <div>
                  <div className="pinput-row">
                    <input className="pinput" maxLength={4} placeholder="CODE" value={partnerCode} onChange={e=>{setPartnerCode(e.target.value.toUpperCase());setPartnerError(false);}} onKeyDown={e=>e.key==="Enter"&&connectPartner()}/>
                    <button className="pconnect-btn" onClick={connectPartner}>Voir <Icon name="arrow" size={13}/></button>
                  </div>
                  {partnerError&&<div style={{fontSize:10,color:"#e87070",marginTop:5,textAlign:"center"}}>Code incorrect</div>}
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      {modal&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{modal.mode==="add"?"Nouvel événement":"Modifier"}</div>
            <input className="minput" placeholder="Titre" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:5}}>Début</div>
            <div style={{display:"flex",gap:7,marginBottom:9}}>
              <input className="minput" style={{flex:1,marginBottom:0}} type="number" min="0" max="23" placeholder="Heure" value={form.hour} onChange={e=>setForm({...form,hour:e.target.value})}/>
              <input className="minput" style={{flex:1,marginBottom:0}} type="number" min="0" max="59" placeholder="Min" value={form.min} onChange={e=>setForm({...form,min:e.target.value})}/>
            </div>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:5}}>Fin (optionnel)</div>
            <div style={{display:"flex",gap:7}}>
              <input className="minput" style={{flex:1}} type="number" min="0" max="23" placeholder="Heure" value={form.endHour} onChange={e=>setForm({...form,endHour:e.target.value})}/>
              <input className="minput" style={{flex:1}} type="number" min="0" max="59" placeholder="Min" value={form.endMin} onChange={e=>setForm({...form,endMin:e.target.value})}/>
            </div>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:7}}>Couleur</div>
            <div className="cpick">{COLORS.map(c=><div key={c.key} className={`cdot ${form.color===c.key?"sel":""}`} style={{background:c.hex}} onClick={()=>setForm({...form,color:c.key})}/>)}</div>
            <div className="macts">
              {modal.mode==="edit"&&<button className="bdel" onClick={delEv}>Supprimer</button>}
              <button className="bcanc" onClick={()=>setModal(null)}>Annuler</button>
              <button className="bsave" onClick={saveEv}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {habitModal&&(
        <div className="overlay" onClick={()=>setHabitModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{editHabitId?"Modifier":"Nouvelle habitude"}</div>
            <input className="minput" placeholder="Nom de l'habitude" value={habitForm.name} onChange={e=>setHabitForm({...habitForm,name:e.target.value})}/>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:7}}>Icône</div>
            <IconPicker value={habitForm.emoji} onChange={v=>setHabitForm({...habitForm,emoji:v})}/>
            <div className="macts">
              {editHabitId&&<button className="bdel" onClick={delHabit}>Supprimer</button>}
              <button className="bcanc" onClick={()=>setHabitModal(false)}>Annuler</button>
              <button className="bsave" onClick={saveHabit}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {cycleModal&&(
        <div className="overlay" onClick={()=>setCycleModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{{start:"Début des règles",end:"Fin des règles",edit:"Modifier mes règles",add:"Ajouter des règles"}[cycleModal.mode]}</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:10,textAlign:"center",lineHeight:1.5}}>
              {cycleModal.mode==="end"?"Choisis le dernier jour de tes règles.":"Indique le 1er jour et, si tu le connais, le dernier jour de tes règles."}
            </div>
            {cycleModal.mode!=="end"&&<>
              <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:5}}>1er jour</div>
              <input className="minput" type="date" value={cycleForm.start} onChange={e=>setCycleForm({...cycleForm,start:e.target.value})}/>
            </>}
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:5}}>Dernier jour{cycleModal.mode==="end"?"":" (optionnel)"}</div>
            <input className="minput" type="date" min={cycleForm.start} value={cycleForm.end} onChange={e=>setCycleForm({...cycleForm,end:e.target.value})}/>
            <div className="macts">
              {cycleModal.mode==="edit"&&<button className="bdel" onClick={delPeriod}>Supprimer</button>}
              <button className="bcanc" onClick={()=>setCycleModal(null)}>Annuler</button>
              <button className="bsave" onClick={saveCycleEdit}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {rulesModal&&(
        <div className="overlay" onClick={()=>setRulesModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">Mes règles d'or</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:10,textAlign:"center"}}>Une règle par ligne</div>
            <textarea className="minput" style={{minHeight:130,resize:"vertical",fontFamily:"'Jost',sans-serif"}} value={rulesForm} onChange={e=>setRulesForm(e.target.value)}/>
            <div className="macts">
              <button className="bcanc" onClick={()=>setRulesModal(false)}>Annuler</button>
              <button className="bsave" onClick={saveRules}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {stepsModal&&(
        <div className="overlay" onClick={()=>setStepsModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{stepsModal==="morning"?"Routine du matin":"Routine du soir"}</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:10,textAlign:"center"}}>Une étape par ligne, dans l'ordre</div>
            <textarea className="minput" style={{minHeight:160,resize:"vertical",fontFamily:"'Jost',sans-serif"}} value={stepsForm} onChange={e=>setStepsForm(e.target.value)}/>
            <div className="macts">
              <button className="bcanc" onClick={()=>setStepsModal(null)}>Annuler</button>
              <button className="bsave" onClick={saveSteps}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {khModal&&(
        <div className="overlay" onClick={()=>setKhModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{editKhId?"Modifier":"Nouvelle habitude clé"}</div>
            <input className="minput" placeholder="Nom (ex: Hydratation)" value={khForm.label} onChange={e=>setKhForm({...khForm,label:e.target.value})}/>
            <input className="minput" placeholder="Détail (ex: 2L / jour)" value={khForm.sub} onChange={e=>setKhForm({...khForm,sub:e.target.value})}/>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:7}}>Icône</div>
            <IconPicker value={khForm.icon} onChange={v=>setKhForm({...khForm,icon:v})}/>
            <div className="macts">
              {editKhId&&<button className="bdel" onClick={delKh}>Supprimer</button>}
              <button className="bcanc" onClick={()=>setKhModal(false)}>Annuler</button>
              <button className="bsave" onClick={saveKh}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      <div className="bnav" style={{justifyContent:"center"}}>
        <button className="nbc" style={{marginTop:0}} onClick={()=>{if(tab==="calendar")openAdd();else if(tab==="todo"){setTodoInput("");setTimeout(()=>document.querySelector(".tinput")?.focus(),50);}else if(tab==="habits")openHabitAdd();else setTab("home");}}>{["calendar","todo","habits"].includes(tab)?<Icon name="plus" size={22} strokeWidth={2.2}/>:<Icon name="home" size={19}/>}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>

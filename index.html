function getDayOfCycle(date,start=CYCLE_START){
  const ms=date-start,days=Math.floor(ms/86400000);
  return((days%CYCLE_LEN)+CYCLE_LEN)%CYCLE_LEN+1;
}
function getPhaseForDay(d){if(d<=PERIOD_LEN)return PHASES[0];if(d<=14)return PHASES[1];if(d<=17)return PHASES[2];return PHASES[3];}
function getPhaseForDate(date,start=CYCLE_START){return getPhaseForDay(getDayOfCycle(date,start));}
function daysUntilNext(from,start=CYCLE_START){return CYCLE_LEN-getDayOfCycle(from,start)+1;}
function dStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function getMonDay(d){const day=d.getDay();return day===0?6:day-1;}
function getDIM(y,m){return new Date(y,m+1,0).getDate();}
function getFirstMon(y,m){const d=new Date(y,m,1).getDay();return d===0?6:d-1;}

function Icon({name,size=16,strokeWidth=1.8}){
  const p={width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth,strokeLinecap:"round",strokeLinejoin:"round"};
  switch(name){
    case "home":return(<svg {...p}><path d="M3 11l9-7 9 7"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>);
    case "calendar":return(<svg {...p}><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>);
    case "check":return(<svg {...p}><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>);
    case "flame":return(<svg {...p}><path d="M12 3c1 3-3 4-3 8a3 3 0 0 0 6 0c1.2 1 2 2.6 2 4.2A5.2 5.2 0 0 1 12 21a5.2 5.2 0 0 1-5-5.4C7 11 9 9 9 6.5 10 8 12 6 12 3z"/></svg>);

    case "droplet":return(<svg {...p}><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>);

              {hDays.map((d,i)=>{
                const act=sameDay(d,curHabitDate);
                return(<div key={i} className={`hdpill ${act?"on":""}`} onClick={()=>setCurHabitDate(d)}><div className="hdday">{DAYS_FR[getMonDay(d)]}</div><div className="hdnum">{d.getDate()}</div></div>);
              })}
            </div>
            {habits.map(hab=>{
              const ac=HABIT_ACCENT[hab.color]||HABIT_ACCENT.pink;
              const done=(habitChecks[dStr(curHabitDate)]||[]).includes(hab.id);
              return(
                <div key={hab.id} className={`hcard ${done?"done-h":""}`} onClick={()=>toggleHabit(hab.id)}>
                  <div style={{position:"absolute",left:0,top:0,bottom:0,width:4,background:ac.border,borderRadius:"4px 0 0 4px"}}/>
                  <div className="hemoji" style={{background:ac.bg}}>{hab.emoji}</div>
                  <div style={{flex:1}}><div className="hname">{hab.name}</div><div className="hstreak">🔥 {hab.streak} jours</div></div>
                  <div className={`hbigcheck ${done?"on":""}`} onClick={e=>{e.stopPropagation();toggleHabit(hab.id);}}>{done&&"✓"}</div>
                  <button style={{background:"none",border:"none",color:"#ddd",fontSize:13,cursor:"pointer",padding:"0 0 0 3px",opacity:.6}} onClick={e=>openHabitEdit(hab,e)}>✏️</button>
                </div>
              );
            })}
            <button className="add-h-btn" onClick={openHabitAdd}>＋ Nouvelle habitude</button>
          </div>
        )}

        {tab==="routine"&&(
          <div>
            <div className="rt-hero">
              <div className="rt-hero-label">Mission Body</div>
              <div className="rt-hero-title">Ma Routine</div>
              <div className="rt-hero-row">
                <div className="rt-hero-chip">{currentPhase.icon} Phase {currentPhase.label}</div>
                <div className="rt-hero-chip">🏋️ {getSportForPhase(currentPhase.key).title}</div>
              </div>
            </div>

            <div className="rules-box">
              <div className="rt-sec-hdr">
                <div className="rules-title" style={{marginBottom:0}}>Mes règles d'or</div>
                <button className="sec-edit" onClick={openRulesEdit}>✏️ Modifier</button>
              </div>
              {goldenRules.map((r,i)=><div key={i} className="rule-row">{r}</div>)}
            </div>

            <div className="rt-block">
              <div className="rt-sec-hdr">
                <div className="sec-title" style={{marginBottom:0}}>☀️ Matin</div>
                <button className="sec-edit" onClick={()=>openStepsEdit("morning")}>✏️ Modifier</button>
              </div>
              <div className="rt-note">À partir de 7h à 7h30 (8h en vacances si couché tard)</div>
              {morningSteps.map((st,i)=>{
                const id=`m${i}`;
                const on=todayChecks.includes(id);
                return(
                  <div key={id} className={`rt-step ${on?"on":""}`} onClick={()=>toggleRoutineStep(id)}>
                    <div className="rt-step-num">{i+1}</div>
                    <div className="rt-step-label">{st}</div>
                    <div className={`rt-check ${on?"on":""}`}>{on&&"✓"}</div>
                  </div>
                );
              })}
            </div>

            <div className="rt-block">
              <div className="rt-sec-hdr">
                <div className="sec-title" style={{marginBottom:0}}>🌙 Soir</div>
                <button className="sec-edit" onClick={()=>openStepsEdit("evening")}>✏️ Modifier</button>
              </div>
              <div className="rt-note">Dès le retour à la maison, horaires flexibles</div>
              {eveningSteps.map((st,i)=>{
                const id=`s${i}`;
                const on=todayChecks.includes(id);
                return(
                  <div key={id} className={`rt-step ${on?"on":""}`} onClick={()=>toggleRoutineStep(id)}>
                    <div className="rt-step-num">{i+1}</div>
                    <div className="rt-step-label">{st}</div>
                    <div className={`rt-check ${on?"on":""}`}>{on&&"✓"}</div>
                  </div>
                );
              })}
            </div>

            <div className="sec-title">Semaine type · selon ton cycle</div>
            <div className="rt-week-table">
              {routineWeekDays.map((d,i)=>{
                const ph=getPhaseForDate(d,cycleStart);
                const sp=getSportForPhase(ph.key);
                return(
                  <div key={i} className={`rt-week-row ${i===todayWeekIdx?"today":""}`}>
                    <div className="rt-week-day">{DAYS_FR[i]} {d.getDate()}</div>
                    <div className="rt-week-work" style={{color:ph.color}}>{ph.icon} {ph.label}</div>
                    <div className="rt-week-sport">{sp.title}</div>
                  </div>
                );
              })}
            </div>

            <div className="rt-sec-hdr">
              <div className="sec-title" style={{marginBottom:0}}>Habitudes clés</div>
            </div>
            <div className="rt-habits-grid">
              {keyHabits.map(h=>(
                <div key={h.id} className="rt-habit-card kh-card" onClick={()=>openKhEdit(h)}>
                  <div className="rt-habit-icon">{h.icon}</div>
                  <div className="rt-habit-label">{h.label}</div>
                  <div className="rt-habit-sub">{h.sub}</div>
                </div>
              ))}
              <div className="add-kh-card" onClick={openKhAdd}>＋</div>
            </div>
          </div>
        )}

        {tab==="cycle"&&(
          <div>
            <div className="cycle-hero" style={{background:`linear-gradient(135deg,${currentPhase.color},${currentPhase.color}cc)`}}>
              <div className="cycle-deco"/><div className="cycle-deco2"/>
              <div className="cycle-hero-label">Règles dans</div>
              <div className="cycle-hero-days">{daysLeft}</div>
              <div className="cycle-hero-sub">jours · Jour {dayInCycle} du cycle</div>
              <div className="cycle-phase-badge">{currentPhase.icon} Phase {currentPhase.label}</div>
              <button className="cycle-edit-btn" onClick={openCycleEdit}>✏️ Modifier la date de mes dernières règles</button>
            </div>
            <div className="phase-row">
              {PHASES.map((ph,i)=>(
                <div key={ph.key} className={`phase-card ${(activePhase===i||(activePhase===null&&ph.key===currentPhase.key))?"active":""}`}
                  style={{background:`linear-gradient(135deg,${ph.color},${ph.color}bb)`}} onClick={()=>setActivePhase(activePhase===i?null:i)}>
                  <div className="phase-card-icon">{ph.icon}</div>
                  <div className="phase-card-name">{ph.label.slice(0,6)}</div>
                </div>
              ))}
            </div>
            <div className="symp-box">
              <div className="symp-title">Phase {displayPhase.label}</div>
              <div className="symp-sub">{displayPhase.days} — Symptômes fréquents</div>
              <div className="symp-tags">{displayPhase.symptoms.map(s=><div key={s} className="symp-tag" style={{background:displayPhase.light,color:displayPhase.color}}>{s}</div>)}</div>
            </div>
            <div className="symp-box">
              <div className="symp-title">🏋️ Sport recommandé</div>
              <div className="symp-sub">{getSportForPhase(displayPhase.key).title}</div>
              <div style={{fontSize:12,color:DARK,fontWeight:300,lineHeight:1.6}}>{getSportForPhase(displayPhase.key).tip}</div>
            </div>
            <div className="cycle-cal-title">Calendrier du cycle</div>
            <div className="mnav" style={{marginBottom:7}}>
              <button className="arr" onClick={()=>setCalMonth(c=>c.m===0?{y:c.y-1,m:11}:{...c,m:c.m-1})}>‹</button>
              <div className="mtitle" style={{fontSize:15}}>{MONTHS_FR[calMonth.m]} <small>{calMonth.y}</small></div>
              <button className="arr" onClick={()=>setCalMonth(c=>c.m===11?{y:c.y+1,m:0}:{...c,m:c.m+1})}>›</button>
            </div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:9}}>
              {PHASES.map(ph=><div key={ph.key} style={{display:"flex",alignItems:"center",gap:3,fontSize:9,color:"#888"}}><div style={{width:8,height:8,borderRadius:"50%",background:ph.color}}/>{ph.label}</div>)}
            </div>
            <div className="wlabels">{DAYS_FR.map(d=><div key={d} className="wlabel">{d}</div>)}</div>
            <div className="cycle-cgrid" style={{marginBottom:16}}>{mkCycleGrid()}</div>
            <div className="partner-box">
              <div className="partner-title">💝 Partager avec mon partenaire</div>
              <div className="partner-sub">Donne ce code à Tom pour qu'il puisse suivre ton cycle.</div>
              <div className="partner-code-box">
                <div className="partner-code">{MY_CODE}</div>
                <button className="copy-btn" onClick={copyCode}>{copied?"Copié ✓":"Copier"}</button>
              </div>
              <div className="partner-hint">Tom entre ce code dans sa section Cycle 💌</div>
              <div className="partner-divider">— ou —</div>
              <div style={{fontSize:11,color:"#aaa",marginBottom:7}}>Entrer le code de quelqu'un d'autre</div>
              {partnerView?(
                <div>
                  <div className="pview-hero" style={{background:`linear-gradient(135deg,${partnerView.phase.color},${partnerView.phase.color}bb)`}}>
                    <div className="pview-label">Règles dans</div>
                    <div className="pview-days">{partnerView.days} jours</div>
                    <div className="pview-phase">{partnerView.phase.icon} Phase {partnerView.phase.label}</div>
                  </div>
                  <div className="pview-name">Connecté à {partnerView.name}</div>
                  <button className="disconnect-btn" onClick={()=>{setPartnerView(null);setPartnerCode("");}}>Se déconnecter</button>
                </div>
              ):(
                <div>
                  <div className="pinput-row">
                    <input className="pinput" maxLength={4} placeholder="CODE" value={partnerCode} onChange={e=>{setPartnerCode(e.target.value.toUpperCase());setPartnerError(false);}} onKeyDown={e=>e.key==="Enter"&&connectPartner()}/>
                    <button className="pconnect-btn" onClick={connectPartner}>Voir →</button>
                  </div>
                  {partnerError&&<div style={{fontSize:10,color:"#e87070",marginTop:5,textAlign:"center"}}>Code incorrect 💬</div>}
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      {modal&&(
        <div className="overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{modal.mode==="add"?"Nouvel événement":"Modifier"}</div>
            <input className="minput" placeholder="Titre" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:5}}>Début</div>
            <div style={{display:"flex",gap:7,marginBottom:9}}>
              <input className="minput" style={{flex:1,marginBottom:0}} type="number" min="0" max="23" placeholder="Heure" value={form.hour} onChange={e=>setForm({...form,hour:e.target.value})}/>
              <input className="minput" style={{flex:1,marginBottom:0}} type="number" min="0" max="59" placeholder="Min" value={form.min} onChange={e=>setForm({...form,min:e.target.value})}/>
            </div>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:5}}>Fin (optionnel)</div>
            <div style={{display:"flex",gap:7}}>
              <input className="minput" style={{flex:1}} type="number" min="0" max="23" placeholder="Heure" value={form.endHour} onChange={e=>setForm({...form,endHour:e.target.value})}/>
              <input className="minput" style={{flex:1}} type="number" min="0" max="59" placeholder="Min" value={form.endMin} onChange={e=>setForm({...form,endMin:e.target.value})}/>
            </div>
            <div style={{fontSize:10,color:"#bbb",letterSpacing:".4px",marginBottom:7}}>Couleur</div>
            <div className="cpick">{COLORS.map(c=><div key={c.key} className={`cdot ${form.color===c.key?"sel":""}`} style={{background:c.hex}} onClick={()=>setForm({...form,color:c.key})}/>)}</div>
            <div className="macts">
              {modal.mode==="edit"&&<button className="bdel" onClick={delEv}>Supprimer</button>}
              <button className="bcanc" onClick={()=>setModal(null)}>Annuler</button>
              <button className="bsave" onClick={saveEv}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {habitModal&&(
        <div className="overlay" onClick={()=>setHabitModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{editHabitId?"Modifier":"Nouvelle habitude"}</div>
            <input className="minput" placeholder="Nom de l'habitude" value={habitForm.name} onChange={e=>setHabitForm({...habitForm,name:e.target.value})}/>
            <input className="minput" placeholder="Emoji (ex: 🏃‍♀️)" value={habitForm.emoji} onChange={e=>setHabitForm({...habitForm,emoji:e.target.value})}/>
            <div className="macts">
              {editHabitId&&<button className="bdel" onClick={delHabit}>Supprimer</button>}
              <button className="bcanc" onClick={()=>setHabitModal(false)}>Annuler</button>
              <button className="bsave" onClick={saveHabit}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {cycleModal&&(
        <div className="overlay" onClick={()=>setCycleModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">Modifier mes dernières règles</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:10,textAlign:"center",lineHeight:1.5}}>Choisis le 1er jour de tes dernières règles pour recaler le cycle.</div>
            <input className="minput" type="date" value={cycleForm} onChange={e=>setCycleForm(e.target.value)}/>
            <div className="macts">
              <button className="bcanc" onClick={()=>setCycleModal(false)}>Annuler</button>
              <button className="bsave" onClick={saveCycleEdit}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {rulesModal&&(
        <div className="overlay" onClick={()=>setRulesModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">Mes règles d'or</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:10,textAlign:"center"}}>Une règle par ligne</div>
            <textarea className="minput" style={{minHeight:130,resize:"vertical",fontFamily:"'Jost',sans-serif"}} value={rulesForm} onChange={e=>setRulesForm(e.target.value)}/>
            <div className="macts">
              <button className="bcanc" onClick={()=>setRulesModal(false)}>Annuler</button>
              <button className="bsave" onClick={saveRules}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {stepsModal&&(
        <div className="overlay" onClick={()=>setStepsModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{stepsModal==="morning"?"Routine du matin":"Routine du soir"}</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:10,textAlign:"center"}}>Une étape par ligne, dans l'ordre</div>
            <textarea className="minput" style={{minHeight:160,resize:"vertical",fontFamily:"'Jost',sans-serif"}} value={stepsForm} onChange={e=>setStepsForm(e.target.value)}/>
            <div className="macts">
              <button className="bcanc" onClick={()=>setStepsModal(null)}>Annuler</button>
              <button className="bsave" onClick={saveSteps}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      {khModal&&(
        <div className="overlay" onClick={()=>setKhModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="mod-title">{editKhId?"Modifier":"Nouvelle habitude clé"}</div>
            <input className="minput" placeholder="Nom (ex: Hydratation)" value={khForm.label} onChange={e=>setKhForm({...khForm,label:e.target.value})}/>
            <input className="minput" placeholder="Détail (ex: 2L / jour)" value={khForm.sub} onChange={e=>setKhForm({...khForm,sub:e.target.value})}/>
            <input className="minput" placeholder="Emoji (ex: 💧)" value={khForm.icon} onChange={e=>setKhForm({...khForm,icon:e.target.value})}/>
            <div className="macts">
              {editKhId&&<button className="bdel" onClick={delKh}>Supprimer</button>}
              <button className="bcanc" onClick={()=>setKhModal(false)}>Annuler</button>
              <button className="bsave" onClick={saveKh}>Enregistrer</button>
            </div>
          </div>
        </div>
      )}

      <div className="bnav" style={{justifyContent:"center"}}>
        <button className="nbc" style={{marginTop:0}} onClick={()=>{if(tab==="calendar")openAdd();else if(tab==="todo"){setTodoInput("");setTimeout(()=>document.querySelector(".tinput")?.focus(),50);}else if(tab==="habits")openHabitAdd();else setTab("home");}}>{["calendar","todo","habits"].includes(tab)?"＋":<Icon name="home" size={19}/>}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
